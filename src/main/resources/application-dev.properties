spring.application.name=geosentinel

server.servlet.context-path=/api/v1

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

#server.address=10.226.9.235

server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/geoguardb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:database}}

spring.jpa.hibernate.ddl-auto=update

jwt.secretKey=${JWT_SECRET_KEY}
auth.refresh-cookie-secure=${AUTH_REFRESH_COOKIE_SECURE:false}
auth.refresh-cookie-same-site=${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
